name: .NET

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
    steps:
    - uses: actions/checkout@v7
      with:
        # The Wycheproof test vectors are a submodule; without this the ECDH tests
        # cannot find their data and the suite fails on a missing file.
        submodules: recursive

    - name: Setup dotnet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.0.x'

    # Gates the pack/publish below - the package is not built unless the full
    # suite, including the Wycheproof ECDH vectors, passes.
    - name: Test
      run: dotnet test GooglePay.PaymentDataCryptography.Tests/GooglePay.PaymentDataCryptography.Tests.csproj --configuration Release

    - name: Pack
      run: |
        if [ "$GITHUB_REF" = "refs/heads/master" ]; then
          VERSION_ARGS=""
        else
          # SemVer prerelease labels allow only [0-9A-Za-z-], so flatten anything else in the branch name.
          SUFFIX="$(printf '%s' "$GITHUB_REF_NAME" | tr -c '0-9A-Za-z-' '-')$GITHUB_RUN_NUMBER"
          VERSION_ARGS="--version-suffix $SUFFIX"
        fi
        PROJECT=GooglePay.PaymentDataCryptography/GooglePay.PaymentDataCryptography.csproj
        dotnet build "$PROJECT" --configuration Release $VERSION_ARGS
        dotnet pack "$PROJECT" --configuration Release --no-build --output out $VERSION_ARGS

    - name: Publish to NuGet
      if: github.ref == 'refs/heads/master'
      run: dotnet nuget push ./out/GooglePay-CryptoUtils.*.symbols.nupkg -k ${{ secrets.Nuget_tristan }} -s https://api.nuget.org/v3/index.json --skip-duplicate
